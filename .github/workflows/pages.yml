name: Publish GitHub Pages showcase

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "core/**"
      - "server/app.py"
      - "requirements*.txt"
      - "scripts/check_pages_build.mjs"
      - "scripts/export_public_demo.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock.txt
      - run: python -m pip check
      - name: Verify recorded examples against the current Python engine
        run: python scripts/export_public_demo.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run lint
      - run: npm --prefix web run build:pages
      - run: node scripts/check_pages_build.mjs
      - name: Check the repository publishing setting
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null) && [ "$source" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::An owner must enable Settings > Pages > Source: GitHub Actions, then run this workflow again. The verified site artifact is still available."
            echo "Deployment is waiting for an owner to enable **Settings → Pages → Source: GitHub Actions**. After enabling, run this workflow again. The tested static site artifact has been built." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: steps.pages_check.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist-pages

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified showcase
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
